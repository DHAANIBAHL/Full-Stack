<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <style>
        ul{
            list-style-type: none;
        }
    </style>
</head>
<body>
    <h3>Fruits</h3>
    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Cucumber
            <ul>
                <li>Green</li>
                <li>Desi</li>
                <li>English</li>
            </ul>
        </li>
        <li>Litchi</li>
    </ul>
    <h3>Grocceries</h3>
    <ol>
        <li>cake</li>
        <li>cookies</li>
        <li>mill</li>
    </ol>
    <h3>Descriptions</h3>
    <dl>
        <dt>Title</dt>
        <dd>The ultimate kitchen</dd>
        <dt>Creator</dt>
        <dd>IDK WHO</dd>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
    </dl>

</body>
</html>
